services:
  db:
    image: postgres:16-alpine
    container_name: salon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon_pass}
      POSTGRES_DB: ${POSTGRES_DB:-salon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salon_user} -d ${POSTGRES_DB:-salon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salon_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-salon_user}:${POSTGRES_PASSWORD:-salon_pass}@db:5432/${POSTGRES_DB:-salon_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-long-random-string}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      FIRST_ADMIN_PHONE: ${FIRST_ADMIN_PHONE:-0501234567}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin123}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-מנהל ראשי}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: salon_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
    driver: local
